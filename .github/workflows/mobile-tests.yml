name: Mobile Tests

on:
  pull_request:
    paths:
      - "mobile/**"

permissions:
  contents: read

jobs:
  test:
    name: Run mobile unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          if pnpm pkg get scripts.test | grep -qv '^null$'; then
            pnpm test
          elif find . -type f \( -name '*.test.js' -o -name '*.test.jsx' -o -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.js' -o -name '*.spec.jsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit | grep -q .; then
            echo "Mobile test files exist, but no test script is configured." >&2
            exit 1
          else
            echo "No mobile test script is configured; skipping."
          fi
